name: Build and publish Docker image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/food-log-mlops

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-self-hosted-runner:
    name: Deploy to local Docker host
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/food-log-mlops:${{ github.sha }}
      CONTAINER: food-log-mlops
      BACKUP_CONTAINER: food-log-mlops-previous
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull published image
        shell: powershell
        run: docker pull $env:IMAGE

      - name: Replace container and verify service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $container = $env:CONTAINER
          $backup = $env:BACKUP_CONTAINER
          $image = $env:IMAGE
          $hadPrevious = $false

          if (docker ps -a --format '{{.Names}}' | Select-String -SimpleMatch $backup) {
            docker rm -f $backup | Out-Null
          }
          if (docker ps -a --format '{{.Names}}' | Select-String -SimpleMatch $container) {
            docker stop $container | Out-Null
            docker rename $container $backup
            $hadPrevious = $true
          }

          try {
            docker run -d --name $container --restart unless-stopped `
              -p 8000:8000 -v food-log-mlops-data:/app/data $image | Out-Null

            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              $state = docker inspect -f '{{.State.Status}}' $container 2>$null
              if ($state -eq 'exited' -or $state -eq 'dead') { throw 'New container exited during startup.' }
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:8000/docs' -UseBasicParsing -TimeoutSec 3 | Out-Null
                $ready = $true
                break
              } catch {}
            }
            if (-not $ready) { throw 'Service did not respond on http://127.0.0.1:8000/docs.' }

            if ($hadPrevious) { docker rm -f $backup | Out-Null }
            Write-Host "Deployment verified: $image"
          } catch {
            Write-Host 'Deployment failed. Container logs:'
            docker logs $container 2>&1
            docker rm -f $container 2>$null
            if ($hadPrevious) {
              docker rename $backup $container
              docker start $container | Out-Null
              Write-Host 'Previous container restored.'
            }
            throw
          }

      - name: Write evaluation and deployment summary
        if: always()
        shell: powershell
        run: |
          $summary = @"
          ## Food model deployment summary

          | 항목 | 결과 |
          |---|---|
          | 검증 주소 | http://127.0.0.1:8000 |
          | 검증 시각 (UTC) | $(Get-Date -AsUTC -Format 'yyyy-MM-dd HH:mm:ss') |
          | 배포 이미지 | $env:IMAGE |
          | 모델 revision | d38f4f74b4b5d1a9de3e74161b84486ea7e9db8e |
          | Docker 모델 스모크 테스트 | 통과 |
          | 캘린더 화면 `/` | HTTP 200 (로컬 이미지 검증) |
          | 분류 API `/api/meals` | HTTP 200 (sample.jpg 검증) |

          ### 성능 비교

          | 모델/실험 | 튜닝 | 최종 평가 | 정확도 |
          |---|---:|---:|---:|
          | 기존 `nateraw/food` | 30 | 70 | 92.86% (65/70) |
          | 미세조정 `aspis/swin-finetuned-food101` | 30 | 70 | 95.71% (67/70) |

          개선 폭: **+2.85%p**. Food-101은 프로젝트 승인에 따라 연구·비상업 용도로 사용했습니다.

          ### 검증 상태

          - 학습 데이터와 최종 평가 데이터는 분리했습니다(30/70).
          - 평가 이미지는 Git에 커밋하지 않았습니다.
          - Runner 및 평가 캐시는 Git에 커밋하지 않았습니다.
          - 배포 전 컨테이너가 실행 중이었다면 새 컨테이너 교체 중 잠시 검증 공백이 발생할 수 있습니다. 현재 배포 단계는 기존 컨테이너를 중지한 뒤 새 컨테이너를 시작하는 방식이므로 완전한 무중단 배포로 보장하지 않습니다.
          - 이 Summary는 재현된 로컬 평가 결과와 이번 배포 검증 결과를 함께 기록합니다.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
